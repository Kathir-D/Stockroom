# GoReleaser builds every release artefact from a v* tag: the binaries, the
# .deb packages for Debian and Ubuntu, Stockroom-Setup.exe, checksums.txt and
# the Homebrew cask. release.yml then builds the macOS installer app from the
# two darwin binaries (scripts/make-mac-installer.sh).
# .github/workflows/release.yml runs it. Try it locally, without publishing:
#
#   goreleaser release --snapshot --clean
version: 2

project_name: stockroom

before:
  hooks:
    # The binary embeds web-app/dist, so the UI is built first. Building Go
    # first ships the tracked empty directory and a server that answers every
    # page with "built without the web UI".
    - npm ci
    - npm run build --workspace=web-app
    - test -f web-app/dist/index.html

builds:
  - id: stockroom
    main: ./server
    binary: stockroom
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }}

  # The graphical installer for Windows (cmd/winsetup). It is not a Windows
  # build of Stockroom: it carries scripts/get.ps1 and installs the .deb
  # inside WSL. amd64 only, which Windows on ARM runs as it is.
  - id: winsetup
    main: ./cmd/winsetup
    # Not the release name: an archive called the same as its binary makes
    # GoReleaser list one artefact twice.
    binary: winsetup
    env:
      - CGO_ENABLED=0
    goos: [windows]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags:
      # windowsgui: no console window opens behind the browser.
      - -s -w -H=windowsgui

archives:
  - id: stockroom
    ids: [stockroom]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*
      - docs/INSTALL.md
      # setup --with-camera on macOS runs the cask's copy (the .deb has its own).
      # The glob has to be `**`, not `**/*`: the latter only matches paths at
      # least one directory deep, so it ships deploy/camera/empty/.gitkeep and
      # silently drops camera.sh -- the one file that matters.
      - deploy/camera/**

  # The installer ships as the bare .exe, named without a version like the
  # .deb, so releases/latest/download/Stockroom-Setup.exe is always the newest.
  - id: winsetup
    ids: [winsetup]
    formats: [binary]
    name_template: Stockroom-Setup

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

# No changelog stanza. With `use: github-native` GoReleaser POSTs to
# releases/generate-notes even under --skip=publish, and this build job's
# read-only token gets a 401 that fails the whole release. The notes are
# unused anyway: the publish job runs `gh release create --generate-notes`.
# Add one back only alongside a token that can write, and only if something
# reads its output.
changelog:
  disable: true

# The .deb. Its name carries no version, so
# releases/latest/download/stockroom_amd64.deb always resolves to the newest.
nfpms:
  - id: deb
    ids: [stockroom]
    package_name: stockroom
    file_name_template: "{{ .PackageName }}_{{ .Arch }}"
    formats: [deb]
    vendor: Stockroom
    homepage: https://github.com/Kathir-D/Stockroom
    maintainer: Kathir-D <121499256+Kathir-D@users.noreply.github.com>
    description: |-
      Equipment checkout for a school media department.
      Students scan an ID card to sign in and scan item barcodes to borrow and
      return. Runs on one PC with a local PostgreSQL; run `sudo stockroom setup`
      after installing.
    license: See https://github.com/Kathir-D/Stockroom
    section: misc
    priority: optional
    bindir: /usr/bin
    dependencies:
      # 14 is the oldest PostgreSQL the tests-postgres CI job passes on, and
      # 1.60 is the rclone Debian 12 and Ubuntu 24.04 ship
      # (docs/decisions.md, 2026-09-27).
      - postgresql (>= 14)
      - postgresql-client
      - ca-certificates
      - rclone (>= 1.60)
    recommends:
      - xdg-utils
      # The Stockroom Setup launcher asks for the administrator password
      # through polkit. Without it the launcher falls back to a terminal.
      - pkexec
    contents:
      # The graphical installer: an entry in the applications menu that runs
      # `stockroom setup --gui` (docs/INSTALL.md).
      - src: packaging/linux/stockroom-setup.desktop
        dst: /usr/share/applications/stockroom-setup.desktop
        file_info:
          mode: 0644
      - src: packaging/linux/setup-gui
        dst: /usr/lib/stockroom/setup-gui
        file_info:
          mode: 0755
      - src: desktop-app/build/appicon.png
        dst: /usr/share/pixmaps/stockroom.png
        file_info:
          mode: 0644
      - src: packaging/linux/stockroom.service
        dst: /lib/systemd/system/stockroom.service
        file_info:
          mode: 0644
      - src: deploy/camera/
        dst: /usr/share/stockroom/camera/
        type: tree
      - src: README.md
        dst: /usr/share/doc/stockroom/README.md
        file_info:
          mode: 0644
      - src: docs/INSTALL.md
        dst: /usr/share/doc/stockroom/INSTALL.md
        file_info:
          mode: 0644
    scripts:
      postinstall: packaging/linux/postinst
      preremove: packaging/linux/prerm
      postremove: packaging/linux/postrm

# No `homebrew_casks` stanza. The tap's cask is hand-written
# (packaging/mac/stockroom.rb) and filled in by release.yml via
# scripts/make-cask.sh, the same shape Sonar and headless-spotify use.
#
# GoReleaser could still generate one, and the generated file is a worse cask:
# it carries no livecheck, a two-line caveat, and a `postflight` block with no
# rescue. Without that rescue, a Homebrew that dropped the block would make the
# cask invalid, and an invalid cask stops the whole tap from loading - so
# `brew tap` would fail and Sonar and headless-spotify would stop installing
# too. Both of those casks need the rescue for the same reason, and Stockroom
# has it in the template.
#
# A `test do` block is the other thing GoReleaser emits that a hand-written
# cask cannot: release.yml runs `stockroom version` on the built binary instead.
#
# To go back to generating it, delete packaging/mac/stockroom.rb, the two steps
# in release.yml that run make-cask.sh and `brew style`, and restore the stanza
# (v0.9.0 in git history has it).

release:
  github:
    owner: Kathir-D
    name: Stockroom
  prerelease: auto
