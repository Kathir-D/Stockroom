name: tests

# Runs on every pull request and on pushes to main. The job is always called
# "tests" and always finishes green or red, so branch protection can require
# it (see CI.md). On a docs-only change every build and test step is skipped
# and the job still reports success; the check would otherwise never appear
# on such a PR and block the merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# dorny/paths-filter lists a PR's changed files through the API, which the
# default read-only token cannot do without pull-requests: read.
permissions:
  contents: read
  pull-requests: read

# A new push to the same PR cancels the previous run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # Decide whether anything that runs changed. Everything not listed
      # here (Markdown, LICENSE, docs/) is docs-only.
      - name: Detect code changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
              - 'server/**'
              - 'cmd/**'
              - 'supabase/**'
              - 'packages/**'
              - 'desktop-app/**'
              - 'web-app/**'
              - 'package.json'
              - 'package-lock.json'
              - 'scripts/**'
              - '.githooks/**'
              - '.github/workflows/**'
              # Fixtures: examples_test.go imports every file in here.
              - 'examples/**'

      - name: Set up Go
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # One lockfile: this is an npm workspace, so the root package-lock.json
          # is the whole dependency tree for packages/ui, web-app and
          # desktop-app/frontend. The per-app locks it used to list no longer
          # exist.
          cache-dependency-path: package-lock.json

      # Pinned, not `latest`: resolving `latest` calls the GitHub releases API
      # without a token, and when the runner's shared rate limit is spent the
      # job fails here before a single test runs. Bump it by hand, to the
      # version `supabase --version` reports on a working dev machine.
      - name: Set up Supabase CLI
        if: steps.changes.outputs.code == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Postgres plus the rest of the local stack, with every migration and
      # the seed applied. The Go tests and pgTAP both connect on 127.0.0.1:54322.
      - name: Start Supabase
        if: steps.changes.outputs.code == 'true'
        run: supabase start

      - name: go vet
        if: steps.changes.outputs.code == 'true'
        run: go vet ./...

      # STOCKROOM_REQUIRE_DB=1 turns "skip because Postgres is down" into a
      # failure, so a broken database can never look like a green run.
      #
      # -p 1 runs one package at a time. internal/stockroom and server share
      # the same live Postgres, and the restore tests truncate every table in
      # it -- run concurrently, a neighbouring package's rows disappear
      # mid-test and the failure surfaces somewhere unrelated.
      - name: Go tests
        if: steps.changes.outputs.code == 'true'
        run: go test ./... -count=1 -p 1
        env:
          STOCKROOM_REQUIRE_DB: "1"

      - name: Database tests (pgTAP)
        if: steps.changes.outputs.code == 'true'
        run: supabase test db

      # One install, at the repo root. `npm ci --prefix <app>` would give that
      # app its own copy of Svelte and Vite, and the failure is silent:
      # components render but their state never updates
      # (docs/design/design-system.md 2.2). The root install populates
      # packages/ui, web-app and desktop-app/frontend together.
      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: npm ci

      # svelte-check over packages/ui and both hosts. The package is checked
      # first: a type error there breaks both apps, and saying so once is
      # clearer than the same error reported twice.
      - name: Type check (packages/ui + both hosts)
        if: steps.changes.outputs.code == 'true'
        run: npm run check

      - name: "Frontend tests (Vitest: packages/ui + both hosts)"
        if: steps.changes.outputs.code == 'true'
        run: npm test

      - name: Frontend build (both hosts)
        if: steps.changes.outputs.code == 'true'
        run: npm run build

      - name: Docs-only change
        if: steps.changes.outputs.code != 'true'
        run: echo "Only documentation changed; nothing to build or test."

      - name: Stop Supabase
        if: always() && steps.changes.outputs.code == 'true'
        # Skipped quietly when the CLI never installed, so the log's one error
        # is the step that actually failed, not "supabase: command not found".
        run: command -v supabase >/dev/null && supabase stop --no-backup || true

  # Windows is the deployment target (CLAUDE.md §3) and until this job nothing
  # had ever built or run Stockroom on it. There is no Supabase CLI here: the
  # runner image ships a PostgreSQL service, disabled by default, and this job
  # starts it. That is closer to an install than the Linux job is anyway,
  # because the schema gets applied by the server binary itself at boot
  # (stockroom.Migrate), exactly as on a school's machine. pgTAP is not run
  # here: it needs the CLI, and the Linux job already covers it.
  #
  # A separate job with its own name, so branch protection can require
  # `tests` and `tests-windows` independently. Same docs-only skip, same rule:
  # the job always runs and always reports.
  tests-windows:
    name: tests-windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      # The runner's PostgreSQL: user postgres, password root, port 5432.
      DATABASE_URL: postgresql://postgres:root@127.0.0.1:5432/postgres
      PGPASSWORD: root
      STOCKROOM_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Detect code changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
              - 'server/**'
              - 'cmd/**'
              - 'supabase/**'
              - 'packages/**'
              - 'desktop-app/**'
              - 'web-app/**'
              - 'package.json'
              - 'package-lock.json'
              - 'scripts/**'
              - '.githooks/**'
              - '.github/workflows/**'
              - 'examples/**'

      # dev.ps1 has never run on real Windows hardware (CLAUDE.md §13, still
      # open). Parsing it is the least this job can do; a syntax error there is
      # the first thing a Windows developer would otherwise meet.
      - name: Parse dev.ps1
        if: steps.changes.outputs.code == 'true'
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\dev.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
          Write-Host "scripts/dev.ps1 parses cleanly"

      - name: Set up Go
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Start PostgreSQL
        if: steps.changes.outputs.code == 'true'
        run: |
          $svc = Get-Service -Name "postgresql*" | Select-Object -First 1
          Set-Service -Name $svc.Name -StartupType Manual
          Start-Service -Name $svc.Name
          & "$env:PGBIN\pg_isready.exe" -h 127.0.0.1 -p 5432 -t 60
          & "$env:PGBIN\psql.exe" -h 127.0.0.1 -U postgres -d postgres -c "select version()"

      # The production path on Windows: build the one binary, start it against
      # an empty database, and wait for /health. Booting is what applies every
      # migration, so this is also the migration test.
      - name: Build and boot the server (applies the schema)
        if: steps.changes.outputs.code == 'true'
        env:
          SERVER_ADDR: 127.0.0.1:8080
        run: |
          go build -o stockroom.exe ./server
          $proc = Start-Process -FilePath .\stockroom.exe -PassThru -NoNewWindow `
            -RedirectStandardOutput server.out.log -RedirectStandardError server.err.log
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            if ($proc.HasExited) { break }
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:8080/health -TimeoutSec 2
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 1
          }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          Get-Content server.out.log, server.err.log -ErrorAction SilentlyContinue | Select-Object -Last 40
          if (-not $ok) { Write-Error "the server never answered /health"; exit 1 }

      # The Go suite asserts against the demo data, so load it after the
      # server has built the schema. On the Linux job `supabase start` does
      # both halves.
      - name: Load the seed
        if: steps.changes.outputs.code == 'true'
        run: '& "$env:PGBIN\psql.exe" -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f supabase/seed.sql'

      - name: go vet
        if: steps.changes.outputs.code == 'true'
        run: go vet ./...

      # -p 1 for the same reason as the Linux job: one live database, and the
      # restore tests truncate it.
      - name: Go tests
        if: steps.changes.outputs.code == 'true'
        run: go test ./... -count=1 -p 1

      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: npm ci

      - name: Type check (packages/ui + both hosts)
        if: steps.changes.outputs.code == 'true'
        run: npm run check

      - name: "Frontend tests (Vitest: packages/ui + both hosts)"
        if: steps.changes.outputs.code == 'true'
        run: npm test

      - name: Frontend build (both hosts)
        if: steps.changes.outputs.code == 'true'
        run: npm run build

      - name: Docs-only change
        if: steps.changes.outputs.code != 'true'
        run: echo "Only documentation changed; nothing to build or test."
