name: tests

# Runs on every pull request and on pushes to main. The job is always called
# "tests" and always finishes green or red, so branch protection can require
# it (see CI.md). On a docs-only change every build and test step is skipped
# and the job still reports success; the check would otherwise never appear
# on such a PR and block the merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# dorny/paths-filter lists a PR's changed files through the API, which the
# default read-only token cannot do without pull-requests: read.
permissions:
  contents: read
  pull-requests: read

# A new push to the same PR cancels the previous run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # Decide whether anything that runs changed. Everything not listed
      # here (Markdown, LICENSE, docs/) is docs-only.
      - name: Detect code changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
              - 'server/**'
              - 'cmd/**'
              - 'supabase/**'
              - 'packages/**'
              - 'desktop-app/**'
              - 'web-app/**'
              - 'package.json'
              - 'package-lock.json'
              - 'scripts/**'
              - '.githooks/**'
              - '.github/workflows/**'
              # Fixtures: examples_test.go imports every file in here.
              - 'examples/**'
              - 'packaging/**'
              - '.gitattributes'

      - name: Set up Go
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # One lockfile: this is an npm workspace, so the root package-lock.json
          # is the whole dependency tree for packages/ui, web-app and
          # desktop-app/frontend. The per-app locks it used to list no longer
          # exist.
          cache-dependency-path: package-lock.json

      # Pinned, not `latest`: resolving `latest` calls the GitHub releases API
      # without a token, and when the runner's shared rate limit is spent the
      # job fails here before a single test runs. Bump it by hand, to the
      # version `supabase --version` reports on a working dev machine.
      - name: Set up Supabase CLI
        if: steps.changes.outputs.code == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Postgres plus the rest of the local stack, with every migration and
      # the seed applied. The Go tests and pgTAP both connect on 127.0.0.1:54322.
      - name: Start Supabase
        if: steps.changes.outputs.code == 'true'
        run: supabase start

      - name: go vet
        if: steps.changes.outputs.code == 'true'
        run: go vet ./...

      # STOCKROOM_REQUIRE_DB=1 turns "skip because Postgres is down" into a
      # failure, so a broken database can never look like a green run.
      #
      # -p 1 runs one package at a time. internal/stockroom and server share
      # the same live Postgres, and the restore tests truncate every table in
      # it -- run concurrently, a neighbouring package's rows disappear
      # mid-test and the failure surfaces somewhere unrelated.
      - name: Go tests
        if: steps.changes.outputs.code == 'true'
        run: go test ./... -count=1 -p 1
        env:
          STOCKROOM_REQUIRE_DB: "1"

      - name: Database tests (pgTAP)
        if: steps.changes.outputs.code == 'true'
        run: supabase test db

      # One install, at the repo root. `npm ci --prefix <app>` would give that
      # app its own copy of Svelte and Vite, and the failure is silent:
      # components render but their state never updates
      # (docs/design/design-system.md 2.2). The root install populates
      # packages/ui, web-app and desktop-app/frontend together.
      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: npm ci

      # svelte-check over packages/ui and both hosts. The package is checked
      # first: a type error there breaks both apps, and saying so once is
      # clearer than the same error reported twice.
      - name: Type check (packages/ui + both hosts)
        if: steps.changes.outputs.code == 'true'
        run: npm run check

      - name: "Frontend tests (Vitest: packages/ui + both hosts)"
        if: steps.changes.outputs.code == 'true'
        run: npm test

      - name: Frontend build (both hosts)
        if: steps.changes.outputs.code == 'true'
        run: npm run build

      - name: Docs-only change
        if: steps.changes.outputs.code != 'true'
        run: echo "Only documentation changed; nothing to build or test."

      - name: Stop Supabase
        if: always() && steps.changes.outputs.code == 'true'
        # Skipped quietly when the CLI never installed, so the log's one error
        # is the step that actually failed, not "supabase: command not found".
        run: command -v supabase >/dev/null && supabase stop --no-backup || true

  # The oldest PostgreSQL Stockroom runs on. Production uses the operating
  # system's Postgres (ROADMAP.md decision 1): Ubuntu 22.04 ships 14, Debian 12
  # ships 15, Ubuntu 24.04 ships 16. Each leg starts the binary against an
  # empty database so it applies the migrations itself, as an install does,
  # then loads the seed and runs the Go suite. The lowest passing version is
  # the .deb's `Depends: postgresql (>= N)`.
  tests-postgres:
    name: tests-postgres (${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PGPASSWORD: postgres
      STOCKROOM_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Detect code changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
              - 'server/**'
              - 'cmd/**'
              - 'supabase/**'
              - 'packages/**'
              - 'desktop-app/**'
              - 'web-app/**'
              - 'package.json'
              - 'package-lock.json'
              - 'scripts/**'
              - '.githooks/**'
              - '.github/workflows/**'
              - 'examples/**'
              - 'packaging/**'
              - '.gitattributes'
              - '.goreleaser.yaml'

      - name: Set up Go
        if: steps.changes.outputs.code == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and boot the server (applies the schema)
        if: steps.changes.outputs.code == 'true'
        env:
          SERVER_ADDR: 127.0.0.1:8080
        run: |
          go build -o stockroom ./server
          ./stockroom serve > server.log 2>&1 &
          pid=$!
          for _ in $(seq 60); do
            curl -fs http://127.0.0.1:8080/health && break
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          curl -fs http://127.0.0.1:8080/health >/dev/null || { cat server.log; echo "the server never answered /health"; exit 1; }
          kill $pid
          tail -20 server.log

      - name: Load the seed
        if: steps.changes.outputs.code == 'true'
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -q -f supabase/seed.sql

      - name: Go tests
        if: steps.changes.outputs.code == 'true'
        run: go test ./... -count=1 -p 1

      - name: Docs-only change
        if: steps.changes.outputs.code != 'true'
        run: echo "Only documentation changed; nothing to build or test."

  # Builds the .deb, installs it, runs setup, and installs a second .deb
  # carrying one more migration over it (packaging/linux/smoke.sh). The
  # runner is a full VM with systemd, so the ubuntu variant tests the real
  # service. debian-12 runs in a container with no systemd, so it uses
  # setup --no-service and starts the server by hand.
  package-linux:
    name: package-linux (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [ubuntu-24.04, debian-12]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
              - 'server/**'
              - 'supabase/**'
              - 'packages/**'
              - 'web-app/**'
              - 'package.json'
              - 'package-lock.json'
              - 'scripts/**'
              - '.github/workflows/**'
              - 'examples/**'
              - 'deploy/camera/**'
              - 'packaging/**'
              - '.gitattributes'
              - '.goreleaser.yaml'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-go@v5
        if: steps.changes.outputs.code == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        if: steps.changes.outputs.code == 'true'
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true

      # The second package is the first plus one dummy migration, so
      # installing it over the first is an upgrade that must dump the
      # database before migrating.
      - name: Build two packages
        if: steps.changes.outputs.code == 'true'
        env:
          HOMEBREW_TAP_TOKEN: unused
        run: |
          goreleaser release --snapshot --clean --skip=archive,homebrew
          mkdir -p pkgs && cp dist/stockroom_amd64.deb pkgs/first.deb
          echo "create table upgrade_probe (id int);" > supabase/migrations/29990101000000_upgrade_probe.sql
          goreleaser release --snapshot --clean --skip=archive,homebrew
          cp dist/stockroom_amd64.deb pkgs/second.deb
          rm supabase/migrations/29990101000000_upgrade_probe.sql

      - name: Install, set up and upgrade (systemd)
        if: steps.changes.outputs.code == 'true' && matrix.target == 'ubuntu-24.04'
        run: sudo packaging/linux/smoke.sh "$PWD/pkgs/first.deb" "$PWD/pkgs/second.deb"

      - name: Install, set up and upgrade (debian:12, no systemd)
        if: steps.changes.outputs.code == 'true' && matrix.target == 'debian-12'
        run: |
          docker run --rm -v "$PWD/pkgs:/pkgs:ro" \
            -v "$PWD/packaging/linux/smoke.sh:/smoke.sh:ro" debian:12 bash -c '
              apt-get update -q && apt-get install -y -q curl procps &&
              bash /smoke.sh /pkgs/first.deb /pkgs/second.deb --no-service'

      - name: Server log on failure
        if: failure() && matrix.target == 'ubuntu-24.04'
        run: sudo journalctl -u stockroom -n 100 --no-pager

      - name: Docs-only change
        if: steps.changes.outputs.code != 'true'
        run: echo "Only documentation changed; nothing to package."
