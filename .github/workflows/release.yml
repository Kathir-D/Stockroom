name: release

# Builds a release with GoReleaser on a version tag: the binaries for Linux and
# macOS, stockroom_amd64.deb and stockroom_arm64.deb, checksums.txt, and the
# Homebrew cask. .goreleaser.yaml says what goes in each.
#
# The build and the publish are separate jobs. The build runs `npm ci`, which
# runs every dependency's lifecycle scripts, so it gets a read-only token. The
# publish job runs no third-party code: it uploads what the build made and
# commits the cask to the tap. That keeps the write token and the tap token
# away from dependency scripts. It does not vouch for the files themselves:
# the binaries, packages and cask all come from the job that ran `npm ci`, so
# what protects their contents is package-lock.json's pinned hashes.
on:
  push:
    tags: ['v*']
  # A manual run builds a snapshot and publishes nothing, so the workflow can
  # be proven before a tag depends on it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser reads the tags to name the version and the changelog.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # No Go cache in a release build. A cache written by any other run would
      # be restored as trusted and could put its objects into the binary. npm
      # keeps its cache: `npm ci` checks every tarball against the lockfile.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # GoReleaser's before hooks run `npm ci` and build the web UI before the
      # Go build, which embeds it. --skip=publish leaves everything in dist/.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: >-
            release --clean
            ${{ github.event_name == 'push' && '--skip=publish' || '--snapshot' }}

      # The cask can't carry a test block, so check the binary here.
      - name: Check the binary runs
        run: dist/stockroom_linux_amd64_v1/stockroom version

      # The tarballs are what the macOS cask unpacks, and `setup --with-camera`
      # runs deploy/camera/camera.sh out of the one it lands in. (The .deb ships
      # its own copy, at /usr/share/stockroom/camera.) A glob that quietly
      # matches nothing ships a release whose camera is simply absent, with
      # nothing in the build output to say so -- so assert the files are really
      # in there rather than trusting the glob to mean what it looks like.
      #
      # All four archives, not just one. They are the same artifact built for
      # four targets, so a per-target exception here would stay invisible until
      # somebody ran `setup --with-camera` on the platform it applied to. macOS
      # is the only platform that uses the archive copy, and a Linux-only
      # assertion never proves the two macOS ones.
      - name: Check every archive carries the camera
        run: |
          set -euo pipefail
          camera_files=(
            deploy/camera/camera.sh
            deploy/camera/docker-compose.yml
            deploy/camera/compose.linux-webcam.yml
            deploy/camera/com.stockroom.go2rtc.plist.template
          )
          checked=0
          for archive in dist/stockroom_*.tar.gz; do
            # Listed once per archive rather than re-run per file. `tar tzf |
            # grep -q` lets grep exit on the first match, tar takes SIGPIPE, and
            # pipefail would then report a perfectly good listing as a failure.
            # A here-string has no pipe, so there is nothing to break.
            names=$(tar tzf "$archive")
            modes=$(tar tvzf "$archive")
            for f in "${camera_files[@]}"; do
              grep -qxF "$f" <<<"$names" \
                || { echo "::error::$f is missing from $archive"; exit 1; }
            done
            # setup runs camera.sh directly, so it has to arrive executable.
            grep -qE '^-rwxr-xr-x .*deploy/camera/camera\.sh$' <<<"$modes" \
              || { echo "::error::camera.sh is not executable in $archive"; exit 1; }
            checked=$((checked + 1))
          done
          # A glob that matches nothing is the same failure as a glob matching
          # the wrong files, and `for` over an unmatched glob is a silent
          # no-op, so it has to be refused explicitly.
          [ "$checked" -gt 0 ] || { echo "::error::no archives found in dist/"; exit 1; }
          echo "camera.sh present and executable in $checked archives"

      # The tap's cask is hand-written (packaging/mac/stockroom.rb), not the
      # one GoReleaser generates. GoReleaser's is a stub: no livecheck, no
      # caveats worth reading, and a `postflight` block with no rescue, so a
      # Homebrew that dropped the block would make the cask invalid and stop
      # the whole tap from loading. Sonar and headless-spotify are hand-written
      # for the same reason; this puts Stockroom in the same shape.
      #
      # Built here rather than in publish, because it needs the checksums and
      # the build job is the only one that has them. The version and the sums
      # come from the release's own checksums.txt, so the cask and the
      # published file cannot disagree.
      - name: Write the Homebrew cask
        run: scripts/make-cask.sh "${{ github.ref_name }}" dist/checksums.txt dist/homebrew/Casks/stockroom.rb

      # A cask that Homebrew will not load takes the whole tap with it, so
      # sonar and headless-spotify stop installing too. `brew style` reports the
      # postflight block as one unsatisfiable offense, so it is excluded: see
      # the comment on the block in packaging/mac/stockroom.rb.
      #
      # The runner image ships Homebrew, but it is set up explicitly rather
      # than assumed: a future image that dropped it would otherwise fail this
      # step with "brew: command not found", which reads like a cask problem.
      - name: Check the cask
        run: |
          if ! command -v brew >/dev/null; then
            echo "::error::brew is not on this runner, so the cask was not checked"
            exit 1
          fi
          brew style --except Cask/InstallSteps dist/homebrew/Casks/stockroom.rb

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/checksums.txt
            dist/homebrew/Casks/stockroom.rb
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Only a tag push publishes. workflow_dispatch can run against a tag,
    # which sets github.ref exactly as a push does, so check the event too.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # A tag with a hyphen (v0.9.0-rc.1) is a prerelease, so
      # releases/latest, which get.sh downloads from, skips it.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A re-run (say, after adding the tap secret) finds the release
          # already up. Replace its files and go on to the tap step.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The release for ${TAG} exists. Replacing its files."
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              dist/*.deb dist/*.tar.gz dist/checksums.txt
            exit 0
          fi
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --generate-notes "${flags[@]}" \
            dist/*.deb dist/*.tar.gz dist/checksums.txt

      # The tap is Kathir-D/homebrew-tap, shared with Sonar and
      # headless-spotify. TAP_DEPLOY_KEY is a deploy key on that repository
      # with write access, so it can reach nothing else. A prerelease doesn't
      # touch the tap.
      - name: Update the Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::error::The TAP_DEPLOY_KEY secret is not set, so the cask was not published. The GitHub release is up. Add the secret (CI.md, Releases) and re-run this job."
            exit 1
          fi
          KEY="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$KEY"
          chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:Kathir-D/homebrew-tap.git tap
          mkdir -p tap/Casks
          cp dist/homebrew/Casks/stockroom.rb tap/Casks/stockroom.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/stockroom.rb
          # A re-run for the same tag has nothing new to commit.
          if git diff --cached --quiet; then
            echo "The tap already has stockroom ${TAG}."
            exit 0
          fi
          git commit -m "stockroom ${TAG#v}"
          git push origin HEAD
