name: release

# Builds a release with GoReleaser on a version tag: the binaries for Linux and
# macOS, stockroom_amd64.deb and stockroom_arm64.deb, checksums.txt, and the
# Homebrew cask. .goreleaser.yaml says what goes in each.
#
# The build and the publish are separate jobs. The build runs `npm ci`, which
# runs every dependency's lifecycle scripts, so it gets a read-only token. The
# publish job runs no third-party code: it uploads what the build made and
# commits the cask to the tap. That keeps the write token and the tap token
# away from dependency scripts. It does not vouch for the files themselves:
# the binaries, packages and cask all come from the job that ran `npm ci`, so
# what protects their contents is package-lock.json's pinned hashes.
on:
  push:
    tags: ['v*']
  # A manual run builds a snapshot and publishes nothing, so the workflow can
  # be proven before a tag depends on it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser reads the tags to name the version and the changelog.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # No Go cache in a release build. A cache written by any other run would
      # be restored as trusted and could put its objects into the binary. npm
      # keeps its cache: `npm ci` checks every tarball against the lockfile.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # GoReleaser's before hooks run `npm ci` and build the web UI before the
      # Go build, which embeds it. --skip=publish leaves everything in dist/.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: >-
            release --clean
            ${{ github.event_name == 'push' && '--skip=publish' || '--snapshot' }}
        env:
          # The cask template reads it. The build job never pushes, so it
          # only needs a value.
          HOMEBREW_TAP_TOKEN: unused

      # The cask can't carry a test block, so check the binary here.
      - name: Check the binary runs
        run: dist/stockroom_linux_amd64_v1/stockroom version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/checksums.txt
            dist/homebrew/Casks/stockroom.rb
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Only a tag push publishes. workflow_dispatch can run against a tag,
    # which sets github.ref exactly as a push does, so check the event too.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # A tag with a hyphen (v0.9.0-rc.1) is a prerelease, so
      # releases/latest, which get.sh downloads from, skips it.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A re-run (say, after adding the tap secret) finds the release
          # already up. Replace its files and go on to the tap step.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The release for ${TAG} exists. Replacing its files."
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              dist/*.deb dist/*.tar.gz dist/checksums.txt
            exit 0
          fi
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --generate-notes "${flags[@]}" \
            dist/*.deb dist/*.tar.gz dist/checksums.txt

      # The tap token is a fine-grained token with contents write on
      # Kathir-D/homebrew-stockroom only. A prerelease doesn't touch the tap.
      - name: Update the Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::The HOMEBREW_TAP_TOKEN secret is not set, so the cask was not published. The GitHub release is up. Add the secret (CI.md, Releases) and re-run this job."
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/Kathir-D/homebrew-stockroom.git" tap
          mkdir -p tap/Casks
          cp dist/homebrew/Casks/stockroom.rb tap/Casks/stockroom.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/stockroom.rb
          # A re-run for the same tag has nothing new to commit.
          if git diff --cached --quiet; then
            echo "The tap already has stockroom ${TAG}."
            exit 0
          fi
          git commit -m "stockroom ${TAG}"
          # HEAD names the branch, so this works on a tap created empty (the
          # first push makes the branch) as well as one with a README.
          git push origin HEAD
